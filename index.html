<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro</title>

  <link href='https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css' rel='stylesheet'>

  <link rel="stylesheet" href="css.css">
</head>
<body>
  <main>
    <div class="resume">
      <div class="card income">
        <div class="card-icon">
          <i class='bx bx-trending-up'></i>
        </div>
        <div class="card-info">
          <span class="card-label">Entradas</span>
          <span class="incomes">R$ 0,00</span>
        </div>
      </div>
      <div class="card expense">
        <div class="card-icon">
          <i class='bx bx-trending-down'></i>
        </div>
        <div class="card-info">
          <span class="card-label">Saídas</span>
          <span class="expenses">R$ 0,00</span>
        </div>
      </div>
      <div class="card total">
        <div class="card-icon">
          <i class='bx bx-wallet'></i>
        </div>
        <div class="card-info">
          <span class="card-label">Saldo Total</span>
          <span class="total">R$ 0,00</span>
        </div>
      </div>
    </div>

    <div class="newItem">
      <h2>Nova Transação</h2>
      <div class="form-group">
        <label for="desc">Descrição</label>
        <input type="text" id="desc" placeholder="Ex: Salário, Aluguel..." />
      </div>
      <div class="form-group">
        <label for="amount">Valor</label>
        <input type="number" id="amount" placeholder="0,00" step="0.01" />
      </div>
      <div class="form-group">
        <label for="type">Tipo</label>
        <select id="type">
          <option value="Entrada">Entrada</option>
          <option value="Saída">Saída</option>
        </select>
      </div>
      <button id="btnNew">
        <i class='bx bx-plus'></i>
        Adicionar
      </button>
    </div>

    <div class="transactions">
      <h2>Transações</h2>
      <div id="transactionsList" class="transactions-list">
      </div>
    </div>
  </main>

  <script src="js.js"></script>
</body>
</html>
